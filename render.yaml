services:
  - type: web
    name: moonai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn moon_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 3000
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-1.5-pro
    autoDeploy: true
